apiVersion: v1
kind: Pod
metadata: 
  name: Pathnex-probe-pod
spec:
  containers: 
    - name: web
      image: ngnix
      livenessprobe:
        httpGet:
          path: /
          port: 80
        initialDelayseconds: 5
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds:3
