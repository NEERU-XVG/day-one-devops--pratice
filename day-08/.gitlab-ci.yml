stages: 
  - build
  - deploy

build
  stage: build
  image: maven:3.81-jdk-17
  script:
    - git clone https://github.com/pathnex/sample-java-app.git
    - cd sample-java-app
    - mnv clean complile
   only:
     - main
 
deploy: 
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying to $CI_ENVIRONMENT_NAME BY pathnex"
  only:
    variables:
      - $CI_ENVIRONMENT_NAME == "dev"
